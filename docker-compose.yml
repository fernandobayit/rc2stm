services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
    ports:
      - "8191:8191"
    restart: always

  rc2stm-addon:
    build: .
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PORT=8000
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr